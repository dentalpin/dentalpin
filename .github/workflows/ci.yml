name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check backend/

      - name: Run ruff format check
        run: ruff format --check backend/

  python-lock-freshness:
    # backend/uv.lock is the reproducible-build contract (#356): the
    # Dockerfile installs with `uv sync --frozen`, so a pyproject.toml
    # dependency change without a regenerated lock must fail here, not
    # at the next prod build. Authors fix drift with:
    #   cd backend && uv lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install "uv==0.12.9"

      - name: Lock is in sync with pyproject.toml
        working-directory: backend
        run: uv lock --check

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dental_clinic_test
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_clinic_test
      SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: test
      TESTING: "true"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Run tests (default set)
        working-directory: backend
        run: |
          python -m pytest -v --tb=short

      - name: Alembic round-trip (base → head → base → head)
        working-directory: backend
        run: |
          python -m pytest -v -m alembic_roundtrip --tb=short

  manifest-consistency:
    # Static manifest sanity — every entry point in pyproject.toml must
    # resolve, declare a valid manifest, and its role permissions must
    # match the ROLE_PERMISSIONS table. Runs without a database so we
    # get a quick signal on PRs that touch modules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Validate manifests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: |
          python -m pytest tests/test_module_manifest.py \
                           tests/test_module_manifests_consistency.py \
                           tests/test_manifest_validator.py \
                           tests/test_module_loader.py \
                           tests/test_module_docs.py \
                           -v --tb=short

  modules-json-freshness:
    # frontend/modules.json is generated but committed (it seeds Nuxt
    # layer precedence for docker/local runs until the backend rewrites
    # it) and got chronically clobbered by contributors' local install
    # sets (#264). Same pattern as catalog-freshness: regenerate the
    # canonical form and fail on diff. Authors fix drift locally with:
    #   cd frontend && node scripts/modules-json.mjs \
    #     ../backend/app/modules --prefix /module_layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check modules.json is fresh
        working-directory: frontend
        run: |
          node scripts/modules-json.mjs "$GITHUB_WORKSPACE/backend/app/modules" --prefix /module_layers
          git diff --exit-code modules.json || {
            echo "::error::frontend/modules.json drifted from the canonical generated form."
            echo "Regenerate with: cd frontend && node scripts/modules-json.mjs ../backend/app/modules --prefix /module_layers"
            exit 1
          }

  catalog-freshness:
    # Verifies docs/modules-catalog.md and docs/events-catalog.md are
    # in sync with the manifests + EventType enum + event_bus.publish
    # callsites. Authors regenerate locally with:
    #   python backend/scripts/generate_catalogs.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Check catalogs are fresh
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: |
          python scripts/generate_catalogs.py --check

      - name: Check docs coverage (--strict)
        # ADR 0009 / issue #75. Every module must ship technical docs and,
        # if it has Nuxt pages, screen MDs in both locales. Backfilled in
        # fase 6 (commit that introduced this --strict flip).
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: |
          python scripts/check_docs_coverage.py --strict

  docs-layout:
    # Enforces the docs/ taxonomy from root CLAUDE.md "Documentation policy".
    # Fails if a new markdown file is dropped at docs/ root, an unknown
    # folder is added under docs/, or an image is placed outside
    # docs/screenshots or docs/diagrams.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check docs layout
        run: python scripts/check_docs_layout.py

  docs-portal-build:
    # Smoke test: the VitePress documentation portal (ADR 0009) builds
    # cleanly. Runs on every PR — fast (under a minute) and surfaces
    # broken markdown / sidebar config before deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install portal dependencies
        working-directory: docs/portal
        run: npm install --no-audit --no-fund

      - name: Build portal
        working-directory: docs/portal
        run: npm run build

      - name: Verify dist/ output
        run: test -f docs/portal/.vitepress/dist/index.html

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  frontend-typecheck:
    # vue-tsc over the host app plus every module Nuxt layer. The backend
    # writes `modules.json` at runtime; here we list every layer through
    # the `module_layers` symlink (same trick as ESLint) so bare imports
    # inside layers still resolve against frontend/node_modules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: modules.json with every layer
        working-directory: frontend
        run: node scripts/modules-json.mjs ./module_layers

      - name: Nuxt typecheck (host + all module layers)
        working-directory: frontend
        run: npx nuxt typecheck

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npm run test

  e2e:
    # Browser E2E smoke. Boots db + backend via docker compose, builds
    # the frontend for production and serves the .output bundle on the
    # host (#259 — more representative than nuxt dev, catches
    # bundle/runtime issues dev mode hides), drives it with Playwright
    # on the host. Slow (~6 min). Required on main + PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: testpass
      SECRET_KEY: ci-secret-key-for-e2e

    steps:
      - uses: actions/checkout@v5

      - name: Write .env
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SECRET_KEY=${SECRET_KEY}
          ENVIRONMENT=development
          EOF

      - name: Boot db + backend
        run: docker compose up -d db backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend ready"; break
            fi
            sleep 2
          done

      - name: Run migrations
        run: docker compose exec -T backend python -m app.cli db upgrade

      - name: Seed demo data
        run: ./scripts/seed-demo.sh --lang es

      - name: Install optional modules covered by e2e
        # `periodontogram` ships `auto_install=False`; its spec assumes an
        # operator installed it. Pending installs apply on backend boot.
        run: |
          docker compose exec -T backend python -m app.cli modules install periodontogram
          docker compose restart backend
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend ready"; break
            fi
            sleep 2
          done

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install frontend deps + Playwright browsers
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Generate modules.json with host paths
        # The backend writes `modules.json` with `/module_layers/...`
        # paths that only resolve inside the frontend container. For
        # the host-run Nuxt dev server we regenerate it with absolute
        # host paths pointing at `backend/app/modules/<name>/frontend`.
        working-directory: frontend
        run: node scripts/modules-json.mjs "$GITHUB_WORKSPACE/backend/app/modules"

      - name: Build frontend (production)
        # Prod-build e2e is more representative than nuxt dev and
        # catches bundle/runtime issues dev mode hides (#259). The
        # API_BASE_URL* values bake the runtimeConfig defaults; the
        # NUXT_* runtime overrides below keep them authoritative at
        # serve time either way.
        working-directory: frontend
        env:
          API_BASE_URL: http://localhost:8000
          API_BASE_URL_SERVER: http://localhost:8000
          # Default Node heap OOMs since the 9-locale × 22-layer i18n
          # surface (#304 tipped it over); runners have 16 GB. The RSS
          # budget below (#322) makes the next regression fail here with
          # a number instead of as a production-image OOM.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          /usr/bin/time -v npm run build 2> /tmp/build-time.log || { cat /tmp/build-time.log; exit 1; }
          grep -v "Maximum resident" /tmp/build-time.log | tail -20
          rss_kb=$(grep 'Maximum resident set size' /tmp/build-time.log | grep -o '[0-9]*')
          echo "Frontend prod build peak RSS: $((rss_kb / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          budget_kb=$((6800 * 1024))
          if [ "$rss_kb" -gt "$budget_kb" ]; then
            echo "::error::Frontend build peak RSS $((rss_kb / 1024))MB exceeds the 6800MB budget — a module or locale addition tipped it over (issue #322)."
            exit 1
          fi

      - name: Start Nuxt (production build) in background
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NUXT_API_BASE_URL_SERVER: http://localhost:8000
          NITRO_HOST: 0.0.0.0
          NITRO_PORT: "3000"
          # Enforce the CSP under e2e (#355) so a new inline handler or
          # external origin fails here — tests/e2e/csp.spec.ts asserts
          # zero "Refused to …" console lines on login + dashboard.
          NUXT_CSP_MODE: enforce
        run: |
          nohup node .output/server/index.mjs > /tmp/nuxt.log 2>&1 &
          echo "nuxt started (pid $!)"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 120); do
            if [ "$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/login)" = "200" ]; then
              echo "frontend ready"; break
            fi
            sleep 2
          done
          curl -sf -o /dev/null -w "final status: %{http_code}\n" http://localhost:3000/login

      - name: Run E2E
        working-directory: frontend
        run: npx playwright test --reporter=list

      - name: Upload Nuxt log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nuxt-dev-log
          path: /tmp/nuxt.log
          retention-days: 7

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
